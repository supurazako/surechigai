[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = m5stack-tab5-p4
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
